apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pan-agent-anthropic
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: pan-agent-anthropic
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: anthropic
        property: claude_oauth_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pan-agent-telegram
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: pan-agent-telegram
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: telegram
        property: telegram_bot_pan_agent_token
    - secretKey: TELEGRAM_ADMIN_ID
      remoteRef:
        key: telegram
        property: telegram_admin_id
    - secretKey: TELEGRAM_ALLOWED_IDS
      remoteRef:
        key: telegram
        property: telegram_allowed_ids
---
