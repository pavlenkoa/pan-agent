# One always-on operator process (architecture doc section 2). Person pods
# are created at runtime by this operator — they are NOT manifests in git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pan-agent-operator
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    # Never two Telegram getUpdates consumers at once (409 from Telegram).
    type: Recreate
  selector:
    matchLabels:
      app: pan-agent-operator
  template:
    metadata:
      labels:
        app: pan-agent-operator
    spec:
      serviceAccountName: pan-agent-operator
      {{- if .Values.nodeName }}
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/operator/index.js"]
          env:
            - name: NAMESPACE
              value: {{ .Release.Namespace }}
            - name: PERSON_POD_IMAGE
              value: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            {{- if .Values.nodeName }}
            - name: PERSON_POD_NODE
              value: {{ .Values.nodeName | quote }}
            {{- end }}
            - name: NFS_SERVER
              value: {{ .Values.nfs.server | quote }}
            - name: NFS_ROOT_PATH
              value: {{ .Values.nfs.rootPath | quote }}
            - name: NFS_MOUNT_PATH
              value: {{ .Values.nfs.mountPath | quote }}
            - name: MEDIA_PVC_NAME
              value: pan-agent-media-nfs
            - name: PERSONA_CONFIGMAP_NAME
              value: pan-agent-persona
            - name: TASKS_API_PORT
              value: {{ .Values.operator.tasksApiPort | quote }}
            - name: OAUTH_CALLBACK_PORT
              value: {{ .Values.operator.oauthCallbackPort | quote }}
            - name: PUBLIC_CALLBACK_HOST
              value: {{ .Values.operator.publicCallbackHost | quote }}
            - name: DEFAULT_TZ
              value: {{ .Values.defaultTz | quote }}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pan-agent-telegram
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_ADMIN_ID
              valueFrom:
                secretKeyRef:
                  name: pan-agent-telegram
                  key: TELEGRAM_ADMIN_ID
            - name: TELEGRAM_ALLOWED_IDS
              valueFrom:
                secretKeyRef:
                  name: pan-agent-telegram
                  key: TELEGRAM_ALLOWED_IDS
          ports:
            - name: tasks-api
              containerPort: {{ .Values.operator.tasksApiPort }}
            - name: oauth-callback
              containerPort: {{ .Values.operator.oauthCallbackPort }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          volumeMounts:
            - name: pan-agent-nfs
              mountPath: {{ .Values.nfs.mountPath }}
      volumes:
        - name: pan-agent-nfs
          nfs:
            server: {{ .Values.nfs.server }}
            path: {{ .Values.nfs.rootPath }}
---
apiVersion: v1
kind: Service
metadata:
  name: pan-agent-operator
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: pan-agent-operator
  ports:
    - name: tasks-api
      port: {{ .Values.operator.tasksApiPort }}
      targetPort: {{ .Values.operator.tasksApiPort }}
    - name: oauth-callback
      port: {{ .Values.operator.oauthCallbackPort }}
      targetPort: {{ .Values.operator.oauthCallbackPort }}
