apiVersion: v1
kind: PersistentVolume
metadata:
  name: pan-agent-media-nfs
spec:
  capacity:
    storage: {{ .Values.media.capacity }}
  accessModes:
    - ReadWriteMany
  nfs:
    server: {{ .Values.nfs.server }}
    path: {{ .Values.media.nfsPath }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pan-agent-media-nfs
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: {{ .Values.media.capacity }}
  volumeName: pan-agent-media-nfs
