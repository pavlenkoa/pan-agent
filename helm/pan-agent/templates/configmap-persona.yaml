    ### `esputnik-scripts/edit_message_html.py` (v1)

    ```python
    #!/usr/bin/env python3
    """
    esputnik-multilang-campaign DOM editor. v2

    Applies data-cid/data-alt-cid/data-title-cid/data-href-cid-targeted edits to
    an eSputnik/Stripo email export, and removes whole content blocks (or, for a
    multi-column mobile-adaptive block, just one column) cleanly -- never the
    innermost row alone. Never does text substitution on serialized HTML --
    always parses first.

    Usage:
      python3 edit_message_html.py <input.html> --list-cids
      python3 edit_message_html.py <input.html> <edits.json> <output.html>

    edits.json shape:
    {
      "set_text":     {"<cid>": "new text", ...},
      "set_attr":     {"<cid>": {"alt": "...", "title": "...", "href": "..."}, ...},
      "remove_blocks": ["<cid>", ...]
    }

    A "<cid>" is matched against data-cid, data-alt-cid, data-title-cid, and
    data-href-cid, in that order, on any element in the document -- pass
    whichever value turned up while inventorying the source HTML (--list-cids),
    regardless of which attribute it actually lives on. data-href-cid tags an
    <a href> element itself (confirmed live on a real production export, e.g. a
    "buy now" product link) -- use set_attr with an "href" key on that cid to
    retarget the link at another locale's storefront (e.g. the per-variant `url`
    the price/stock lookup script already returns), never string-replace the
    domain in the raw HTML.

    remove_blocks: locates the block by cid, walks up to the nearest ancestor
    <td class="esd-structure"> (not just the immediate <tr>, which would leave
    sibling rows -- heading/paragraph/button -- of the same visual block
    behind). Two cases from there:
      - Single-block td.esd-structure (one visual block, the common case):
        removes THAT td's own parent <tr> -- the whole section.
      - Multi-column td.esd-structure (confirmed live: a mobile-adaptive 2-up
        product row, two sibling <table class="es-left"/"es-right"> columns
        under one shared td.esd-structure, rebuilt for Outlook via
        "<!--[if mso]>...<![endif]-->" comments around them): removes only the
        specific direct-child <table> column containing the given cid, leaving
        sibling column(s) untouched, and prints a reminder to stderr that the
        MSO comments are NOT rebalanced automatically -- they're opaque text to
        the parser, not real tags, so check/fix them by hand afterward or
        Outlook renders a stale/empty column.
    Verify with --list-cids before AND after a removal if not certain the right
    scope moved -- this is a same-process operation, so BeautifulSoup element
    identity is only meaningful within this one script run, never across
    separate invocations.
    """
    import argparse
    import json
    import sys

    from bs4 import BeautifulSoup

    CID_ATTRS = ("data-cid", "data-alt-cid", "data-title-cid", "data-href-cid")


    def find_by_cid(soup, cid):
        for attr in CID_ATTRS:
            el = soup.find(attrs={attr: cid})
            if el is not None:
                return el, attr
        return None, None


    def list_cids(soup):
        rows = []
        for attr in CID_ATTRS:
            for el in soup.find_all(attrs={attr: True}):
                cid = el.get(attr)
                preview = (el.get_text(strip=True) or el.get("alt") or el.get("title") or "")[:60]
                rows.append((cid, attr, el.name, preview))
        return rows


    def set_text(soup, cid, text):
        el, attr = find_by_cid(soup, cid)
        if el is None:
            raise KeyError(f"no element with any of {CID_ATTRS} == {cid!r}")
        el.string = text


    def set_attrs(soup, cid, attrs):
        el, found_attr = find_by_cid(soup, cid)
        if el is None:
            raise KeyError(f"no element with any of {CID_ATTRS} == {cid!r}")
        for k, v in attrs.items():
            el[k] = v


    def remove_block(soup, cid):
        el, attr = find_by_cid(soup, cid)
        if el is None:
            raise KeyError(f"no element with any of {CID_ATTRS} == {cid!r}")
        block_td = el.find_parent("td", class_="esd-structure")
        if block_td is None:
            raise ValueError(
                f"cid {cid!r} (via {attr}) has no ancestor td.esd-structure -- "
                "removing its immediate parent alone would likely leave sibling "
                "rows of the same visual block behind; refusing to guess"
            )

        columns = block_td.find_all("table", recursive=False)
        if len(columns) > 1:
            # Multi-column (mobile-adaptive) block: this esd-structure td holds
            # more than one independently-removable product/column (e.g. a
            # floated es-left/es-right pair), not one single-block section --
            # removing the whole parent tr would wrongly take every column with
            # it. Remove only the direct-child <table> that actually contains
            # this cid.
            column = None
            node = el
            while node is not None:
                if node.parent is block_td:
                    column = node
                    break
                node = node.parent
            if column is None or column.name != "table":
                raise ValueError(
                    f"cid {cid!r} is inside a multi-column td.esd-structure but "
                    "isn't nested under one of its direct-child <table> columns "
                    "-- can't tell which column to remove, refusing to guess"
                )
            column.decompose()
            print(
                f"NOTE: cid {cid!r} was inside a multi-column (mobile-adaptive) "
                "block -- removed only that one column. This template pattern "
                "wraps columns in Outlook-only '<!--[if mso]>...<![endif]-->' "
                "comments that BeautifulSoup treats as opaque text, NOT real "
                "tags -- they were NOT rebalanced. Inspect the raw output HTML "
                "around this block by eye and fix/remove the matching MSO "
                "<td width=\"...\"> comment fragments by hand, or Outlook will "
                "render a stale/empty column.",
                file=sys.stderr,
            )
            return

        row = block_td.find_parent("tr")
        if row is None:
            raise ValueError(f"cid {cid!r}'s esd-structure td has no parent tr")
        row.decompose()


    def main():
        ap = argparse.ArgumentParser(description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter)
        ap.add_argument("input_html")
        ap.add_argument("edits_json", nargs="?", help="JSON file with set_text/set_attr/remove_blocks")
        ap.add_argument("output_html", nargs="?")
        ap.add_argument("--list-cids", action="store_true", help="print every data-cid/data-alt-cid/data-title-cid/data-href-cid found and exit")
        args = ap.parse_args()

        with open(args.input_html, encoding="utf-8") as f:
            soup = BeautifulSoup(f.read(), "html.parser")

        if args.list_cids:
            for cid, attr, tag, preview in list_cids(soup):
                print(f"{cid:20} {attr:16} <{tag}>  {preview}")
            return

        if not args.edits_json or not args.output_html:
            print("edits_json and output_html are required unless --list-cids", file=sys.stderr)
            sys.exit(1)

        with open(args.edits_json, encoding="utf-8") as f:
            edits = json.load(f)

        for cid, text in edits.get("set_text", {}).items():
            set_text(soup, cid, text)
        for cid, attrs in edits.get("set_attr", {}).items():
            set_attrs(soup, cid, attrs)
        for cid in edits.get("remove_blocks", []):
            remove_block(soup, cid)

        with open(args.output_html, "w", encoding="utf-8") as f:
            f.write(str(soup))

        print(f"wrote {args.output_html}")


    if __name__ == "__main__":
        main()
    ```

    ## Config

    Tunable, not fixed rules — the Ksisters figures below are illustrative
    defaults from this skill's own worked example, not universal:

    - Price-lookup cache TTL: 24h (`--cache-ttl-hours` on `price_lookup.py`).
    - Currency decimal-places buckets in `price_lookup.py`
      (`WHOLE_NUMBER_CURRENCIES`/`DECIMAL_CURRENCIES`) — extend as new
      currencies come up; verify against the real site's own display first.
    - Footer reference table: re-harvest per account as described above; there's
      no live freshness signal to trigger this automatically.

    ## Out of scope

    - `send_broadcast` / `send_email_message` — repeated deliberately from
      "Scope and safety posture" above. This skill only ever produces a saved
      draft; sending is always a separate, human action in the eSputnik UI.
    - Segment/contact edits, workflow edits — not touched by anything in this
      skill, regardless of what's asked mid-task.
    - Anything the confirmation gate above would otherwise skip past — if a
      stop point is reached and the reply is ambiguous, ask again rather than
      picking an option on the person's behalf.
