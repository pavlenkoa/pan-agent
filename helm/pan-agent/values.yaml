# Default values for pan-agent.
# Environment-specific overrides (node, NFS server, CIDRs, ...) belong in the
# deploying cluster's GitOps repo, not here — see homelab's
# kubernetes/apps/pan-agent/values/homelab.yaml for the reference deployment.

image:
  repository: ghcr.io/pavlenkoa/pan-agent
  tag: latest
  pullPolicy: Always

# Both the operator and person pods (spawned by the operator with the same
# image) run on this single node — required today, since NFS home
# provisioning and PERSON_POD_NODE assume co-location. Empty = no pinning.
nodeName: ""

operator:
  tasksApiPort: 8081
  # A second, isolated HTTP server (esputnik-oauth's public callback route,
  # see CLAUDE.md's eSputnik OAuth design note) — deliberately not the same
  # server/port as tasksApiPort, so a bug in one can't reach the other.
  oauthCallbackPort: 8082
  # Public hostname the callback is actually reachable at — must exactly
  # match whatever the deploying cluster's HTTPRoute serves this port under
  # (byte-identical redirect_uri on every eSputnik OAuth call). Environment-
  # specific in principle, but every current deployment uses the same
  # homelab, so it's a plain default here rather than requiring every
  # environment's values file to set it.
  publicCallbackHost: api.pavlenko.io
  # Auto-compact token ceiling (session-controller.ts) a person gets at pod
  # create/recreate time, absent their own /context_limit override
  # (persisted per-person, always wins once set). highSlugs is a deliberately
  # explicit allowlist for heavier/longer-running usage, not self-service —
  # environment-specific person slugs belong in the deploying cluster's
  # values file (e.g. homelab's), not here.
  contextLimits:
    default: 400000
    high: 700000
    highSlugs: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

defaultTz: UTC

nfs:
  server: ""
  # Per-person home directories, mkdir'd by the operator itself.
  rootPath: /media/pan-agent
  mountPath: /mnt/pan-agent-nfs

# Media library PV, mounted read-write into every person pod.
media:
  nfsPath: /media
  capacity: 1Ti

network:
  qbittorrentNamespace: qbittorrent
  # Emby reachability (e.g. the OrbStack host.internal range). Empty disables that egress rule.
  embyCidrs: []
  # Private ranges excluded from the pods' "allow all internet" egress rule.
  excludeCidrs: []
